{% extends 'admin/baseAI.html' %}

{% block title %}
Set Auto Training Schedule
{% endblock %}

{% block content %}

<div class="max-w-4xl mx-auto">
    <h1 class="text-2xl font-semibold text-gray-900 mb-6">Training</h1>

    <div x-data="{
        trainingProgress: 30, // 0 to 100 for progress bar
        accuracy: 0,
        pause: false,
        documentsUsedSteps: [0, 10, 30, 70, 200, 500, 1000]
    }" class="bg-white p-6 rounded-lg shadow-md mb-8">
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center">
                <h2 class="text-xl font-medium text-gray-700 mr-2">Automatic training</h2>
            </div>
        </div>

        <div class="mb-4">
            <div class="relative pt-1">
                <div class="flex items-center justify-between h-2 mb-1">
                    <div class="w-full bg-gray-200 rounded-full h-2">
                        <div class="h-2 rounded-full bg-blue-600" :style="`width: ${trainingProgress}%;`"></div>
                    </div>
                </div>
                <div class="flex justify-between text-xs text-gray-500 font-medium -mt-2">
                    <template x-for="(docCount, index) in documentsUsedSteps" :key="index">
                        <div :class="{
                            'text-blue-600 font-semibold': (trainingProgress / 100) * 100 >= (index / (documentsUsedSteps.length - 1)) * 100,
                            'relative -top-2': index === 0 || index === (documentsUsedSteps.length - 1)
                        }" class="text-center w-1/7">
                            <span x-text="docCount"></span>
                        </div>
                    </template>
                </div>
            </div>
        </div>

    </div>
    <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-sm border border-gray-200">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">ตั้งค่าตารางการฝึกอบรมอัตโนมัติ</h1>

        <form action="#" method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label for="frequency" class="block text-sm font-medium text-gray-700 mb-1">
                    ความถี่ในการฝึกอบรม:
                </label>
                <select id="frequency" name="frequency"
                        class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 
                               focus:ring-blue-500 focus:border-blue-500">
                    <option value="daily">รายวัน</option>
                    <option value="weekly">รายสัปดาห์</option>
                    <option value="monthly">รายเดือน</option>
                </select>
            </div>

            <div>
                <label for="time" class="block text-sm font-medium text-gray-700 mb-1">
                    เวลาที่ต้องการฝึกอบรม:
                </label>
                <input type="time" id="time" name="time"
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm p-2 
                              focus:ring-blue-500 focus:border-blue-500">
            </div>

            <div>
                <button type="submit"
                        class="px-4 py-2 bg-blue-600 text-white rounded-md 
                               hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    บันทึกการตั้งค่า
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
